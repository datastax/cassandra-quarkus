name: Build & test with native-image
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Java ${{ matrix.java_version }}
    strategy:
      matrix:
        graal_version:
          - '25.0'
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: "graalvm"
          version: ${{ matrix.graal_version }}
          github-token: ${{ secrets.GB_TOKEN }}
      - name: Log info
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
      - name: Build & test (native-image)
        run: |
          mvn -B -V install -Prelease -Dgpg.skip -DskipTests=true
          mvn -B -V verify -Dnative -rf :cassandra-quarkus-integration-tests -Djacoco.skip=true
